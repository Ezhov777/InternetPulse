name: Windows 11 build and test
on:
  push:
    branches: [main, v1.7]
    paths: ['Windows/**', 'Windows.Tests/**', 'Assets/**', 'Resources/**', '.github/workflows/windows.yml', 'VERSION']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Show SDK
        run: dotnet --info
      - name: Core integration tests with local HTTP server
        run: dotnet run --project Windows.Tests -c Release
      - name: Publish self-contained Windows x64 app
        run: dotnet publish Windows -c Release -r win-x64 --self-contained true -o dist/windows
      - name: WPF startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process dist/windows/InternetPulse.exe -ArgumentList '--smoke-test','--screenshots' -PassThru
          if (!$process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Startup smoke test timed out' }
          if (Test-Path dist/windows/startup-error.txt) { Get-Content dist/windows/startup-error.txt }
          if ($process.ExitCode -ne 0) { throw "Startup smoke test failed: $($process.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/InternetPulse-$version-win11-x64.zip"
          $asset = Get-Item "dist/InternetPulse-$version-win11-x64.zip"
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($asset.Name)" | Set-Content -Encoding utf8 dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: InternetPulse-Windows-11-x64
          path: |
            dist/screenshots/*.png
            dist/*.zip
            dist/SHA256SUMS-windows.txt
