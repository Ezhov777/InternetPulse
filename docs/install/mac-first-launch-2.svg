<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" rx="24" fill="#12101e"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><circle cx="58" cy="55" r="22" fill="#42e3cf"/><text x="58" y="63" font-size="23" font-weight="700" text-anchor="middle" fill="#151225">2</text><text x="96" y="62" fill="white" font-size="27" font-weight="650">Разрешите запуск Internet Pulse</text><text x="38" y="112" fill="#c8c2d5" font-size="20">Системные настройки → Конфиденциальность</text><text x="38" y="141" fill="#c8c2d5" font-size="20">и безопасность → раздел «Безопасность».</text><rect x="38" y="180" width="924" height="150" rx="20" fill="#242032" stroke="#50475f"/><text x="64" y="218" fill="#a99cbf" font-size="14">КОНФИДЕНЦИАЛЬНОСТЬ И БЕЗОПАСНОСТЬ</text><text x="64" y="262" fill="white" font-size="21">Internet Pulse был заблокирован</text><rect x="655" y="267" width="280" height="43" rx="12" fill="#456acb"/><text x="795" y="295" fill="white" font-size="19" text-anchor="middle">Все равно открыть</text><text x="38" y="376" fill="#9a8fab" font-size="14">Схема действий · вид и названия кнопок могут немного отличаться в разных версиях macOS</text></g></svg>